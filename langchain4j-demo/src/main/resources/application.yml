langchain4j:
  open-ai:
    chat-model:
      # 只用环境变量注入，不要把 key 提交到 git
      api-key: ${DEEPSEEK_API_KEY:sk-REPLACE-ME}
      # LangChain4j 没有 DeepSeek 专用模块，走 OpenAI 兼容。
      # 它的 OpenAI 模块约定 base-url 要带 /v1（默认是 https://api.openai.com/v1）。
      # 如果 404，去掉 /v1 再试：$env:DEEPSEEK_BASE_URL = "https://api.deepseek.com"
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
      # 注意：LangChain4j 官方文档里那段 DeepSeek 示例还在用已退役的 deepseek-chat，
      # 下面的名字来自 DeepSeek 官方文档当前版本。
      model-name: ${AI_MODEL:deepseek-flash}
      temperature: 0.7
      # 打开后能看到 LangChain4j 实际发出的请求体和返回（顺便可以核对 URL 对不对）
      log-requests: true
      log-responses: true

    # ============================================================
    # 这一段是必须的，不是可选优化。
    #
    # OpenAiChatModel 和 OpenAiStreamingChatModel 是两个独立的类（javap 确认）：
    #     public class OpenAiChatModel          implements ChatModel
    #     public class OpenAiStreamingChatModel implements StreamingChatModel
    #
    # 所以只配 chat-model 时，容器里没有 StreamingChatModel Bean。
    # @AiService 里返回 TokenStream 的方法要到「调用时」才失败 —— 表现为
    #   /api/chat 正常，/api/chat/stream 返回 HTTP 500，而启动日志一切正常。
    #
    # 这类"缺 Bean 不影响启动、只在调用时炸"的问题，contextLoads 抓不住，
    # 所以配了 AiWiringTests 专门断言这两个 Bean 都在。
    # ============================================================
    streaming-chat-model:
      api-key: ${DEEPSEEK_API_KEY:sk-REPLACE-ME}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
      model-name: ${AI_MODEL:deepseek-flash}
      temperature: 0.7
      log-requests: true
      log-responses: true
      # 注意：DeepSeek 每个 chunk 都发完整 tool call ID，流式 + 工具调用需要
      # accumulateToolCallId(false)，但它没有对应的 Spring Boot 属性，只能手写 Bean。
      # 详见 README「流式 + 工具调用」一节。

server:
  port: 8082
